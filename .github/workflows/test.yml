name: Test and publish locally
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.3.4
        with:
          fetch-depth: 0
      - uses: sbt/setup-sbt@v1
      - name: 'Linter: Scalafix checks'
        run: sbt "scalafixAll --check"
      - run: |
          sudo apt update
          sudo apt-get install diffoscope
          #sbt test scripted publishLocal
          sbt scripted
